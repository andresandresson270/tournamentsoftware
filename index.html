  <style>
    html { scroll-behavior: smooth; }
    /* touch-action: no double-tap zoom on iOS (pinch zoom still works) */
    body { font-family: 'DM Sans', system-ui, sans-serif; touch-action: manipulation; }
    /* Never let content push the page sideways; clip (not hidden) keeps the sticky header working */
    #app { overflow-x: clip; }
    .pill, .day-tab { transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s; }
    .pill:active, .day-tab:not(:disabled):active { transform: scale(0.97); }
    .day-tab:disabled { cursor: default; }
    /* Group chip on a match row: 26px visual, 44px tap area */
    .group-chip { position: relative; transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s; }
    .group-chip::before { content: ''; position: absolute; left: -4px; right: -4px; top: -9px; bottom: -9px; }
    .group-chip:active, .group-card:active { transform: scale(0.97); }
    .group-card { transition: background-color 0.2s ease, transform 0.1s; }
    /* Group drawer (bottom sheet) */

    #sheet.is-closed #sheet-backdrop { opacity: 0; }
    #sheet.is-closed #sheet-panel { transform: translateY(100%); }
    .sheet-grid { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) 2.5rem 2.5rem 3.5rem; gap: 0.375rem; align-items: center; }

  <!-- Group drawer: standings + where the group goes next. Opened from a group chip or a player's group card. -->

    <div id="sheet-panel" class="absolute inset-x-0 bottom-0 max-w-2xl mx-auto max-h-[88vh] flex flex-col rounded-t-3xl bg-surface-800 border-t border-surface-600 shadow-2xl shadow-black/60">
      <div id="sheet-grab" class="shrink-0 touch-none">
        <div class="flex justify-center pt-2"><span class="w-9 h-1 rounded-full bg-zinc-700"></span></div>
        <div class="flex items-start gap-2 pl-4 pr-2 pt-2">
          <div class="min-w-0 flex-1 pt-1">
            <h2 id="sheet-title" class="text-xl font-semibold tracking-tight truncate"></h2>
            <p id="sheet-sub" class="text-[13px] text-mute truncate"></p>
          </div>
          <button id="sheet-close" type="button" class="w-11 h-11 shrink-0 inline-flex items-center justify-center rounded-xl text-mute hover:text-zinc-100 hover:bg-surface-700 transition-colors" aria-label="Loka">

  <script>
    (function () {
      const tournamentsUrl = 'tournaments.json';
      const dataBaseUrl = 'data';  // data/<id>_v2.json

      const initialHash = decodeURIComponent(location.hash.slice(1));
      let state = {
        tournaments: [],
        currentTournament: null,  // { id, name, startDate, endDate }
        data: null,
        all: [],          // unique matches (no byes), sorted by time
        players: [],      // [{ name, team }] for search
        days: [],         // [{ key, short, long }] every tournament day
        selectedTeam: initialHash.startsWith('p:') ? '' : initialHash,
        selectedPlayer: initialHash.startsWith('p:') ? initialHash.slice(2) : '',
        playerTeam: '',
        selectedDay: '',
      };

      const $ = (id) => document.getElementById(id);
      const $loading = $('loading');
      const $list = $('list');
      const $timelineWrap = $('timeline-wrap');
      const $printHeader = $('print-header');
      const $btnPrint = $('btn-print');
      const $empty = $('empty');
      const $error = $('error');
      const $errorMessage = $('error-message');
      const $lastUpdated = $('last-updated');
      const $tournamentTitle = $('tournament-title');
      const $listTitle = $('list-title');
      const $nav = $('sticky-nav');
      const $dayTabs = $('day-tabs');
      const $btnRefresh = $('btn-refresh');
      const $search = $('search');
      const $searchClear = $('search-clear');
      const $searchWrap = $('search-wrap');
      const $suggest = $('suggest');
      const $btnSearch = $('btn-search');
      const $titleBlock = $('title-block');
      const filterWrap = $('filter-wrap');
      const pillTemplate = $('pill-template');

      const IS_DAYS = ['Sunnudagur','Mánudagur','Þriðjudagur','Miðvikudagur','Fimmtudagur','Föstudagur','Laugardagur'];
      const IS_DAYS_SHORT = ['Sun','Mán','Þri','Mið','Fim','Fös','Lau'];
      const IS_MONTHS = ['janúar','febrúar','mars','apríl','maí','júní','júlí','ágúst','september','október','nóvember','desember'];
      const IS_MONTHS_SHORT = ['jan','feb','mar','apr','maí','jún','júl','ágú','sep','okt','nóv','des'];

      /** Pick default: newest current/upcoming (endDate >= today), or newest past if all finished */
      function pickDefaultTournament(tournaments) {
        if (!tournaments.length) return null;
        const today = new Date().toISOString().slice(0, 10);
        const sorted = [...tournaments].sort((a, b) => (b.endDate || '').localeCompare(a.endDate || ''));
        const currentOrNext = sorted.find((t) => (t.endDate || '') >= today);
        return currentOrNext || sorted[0];
      }

      // ---------- View state helpers ----------

      function showLoading() {
        $loading.classList.remove('hidden');
        $list.classList.add('hidden');
        $empty.classList.add('hidden');
        $error.classList.add('hidden');
        $timelineWrap.classList.add('hidden');
      }

      function showList() {
        $loading.classList.add('hidden');
        $error.classList.add('hidden');
        $empty.classList.add('hidden');
        $list.classList.remove('hidden');
      }

      function showEmpty(title, sub) {
        $loading.classList.add('hidden');
        $list.classList.add('hidden');
        $error.classList.add('hidden');
        $('empty-title').textContent = title;
        $('empty-sub').textContent = sub;
        $empty.classList.remove('hidden');
      }

      function showError(msg, showHint) {
        $loading.classList.add('hidden');
        $list.classList.add('hidden');
        $empty.classList.add('hidden');
        $timelineWrap.classList.add('hidden');
        $error.classList.remove('hidden');
        $errorMessage.textContent = msg || 'Óþekkt villa';
        $('error-hint').classList.toggle('hidden', !showHint);
        if (!state.days.length) $dayTabs.classList.add('invisible');  // no endless skeleton next to an error
      }

      /** Tournament name: header on ≥640px, top of the list on phones, and the browser tab. */
      function setTournamentTitle(name) {
        $tournamentTitle.textContent = name;
        $listTitle.textContent = name;
        document.title = name + ' · BADICE';
      }

      // ---------- Formatting ----------

      const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function escapeHtml(s) {
        return s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ESC[c]);
      }

      const pad2 = (n) => String(n).padStart(2, '0');

      /** Age of the data: "33m" (the refresh chip in the header) */
      function formatAge(iso) {
        if (!iso) return '—';
        const secs = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
        if (secs < 60) return `${secs}s`;
        const mins = Math.floor(secs / 60);
        if (mins < 60) return `${mins}m`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours}h`;
        return `${Math.floor(hours / 24)}d`;
      }
      /** "Uppfært fyrir 33m" (tooltip, print header) */
      function formatLastUpdated(iso) {
        return iso ? 'Uppfært fyrir ' + formatAge(iso) : '—';
      }

      /** Parse "Sat 2/14/2026 11:30 AM" to timestamp for sorting (earliest first). */
      function parseTime(timeStr) {
        if (!timeStr) return 0;
        const d = new Date(timeStr);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      }

      function fmtTime(timeStr) {
        const d = new Date(timeStr);
        return isNaN(d) ? '' : pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      }

      const dayKeyOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      function dayKey(timeStr) {
        const d = new Date(timeStr);
        return isNaN(d) ? '' : dayKeyOf(d);
      }

      /** "Round 1" → "Umferð 1", "Semi final" → "Undanúrslit", … */
      const ROUND_IS = [
        [/^Round (\d+)$/i, 'Umferð $1'],
        [/^Round of (\d+)$/i, '$1 manna úrslit'],
        [/^Qualification round of (\d+)$/i, 'Forkeppni ($1 manna)'],
        [/^Quarter[ -]?finals?$/i, '8 manna úrslit'],
        [/^Semi[ -]?finals?$/i, 'Undanúrslit'],
        [/^Finals?$/i, 'Úrslit'],
      ];
      function roundIs(r) {
        if (!r) return '';
        for (const [re, to] of ROUND_IS) if (re.test(r)) return r.replace(re, to);
        return r;
      }

      /** "1.Deild - Einliðaleikur karla - Group A" → "1.Deild · Einliðaleikur karla · A riðill" */
      function eventIs(e) {
        return (e || '').split(' - ').map((p) => p.trim().replace(/^Group (\S+)$/i, '$1 riðill')).filter(Boolean).join(' · ');
      }

      /** Player name without seed suffix: "Eggert Þór [1/2]" → "Eggert Þór" */
      function baseName(name) {
        return (name || '').replace(/\s*\[[^\]]*\]\s*$/, '').replace(/,/g, '').trim();
      }
      function seedOf(name) {
        const m = /\[([^\]]+)\]\s*$/.exec(name || '');
        return m ? m[1] : '';
      }

      /** Case/accent-insensitive key for search ("Stefan" finds "Stefán", "thor" finds "Þór"). */
      function fold(s) {
        return (s || '').toLowerCase().replace(/þ/g, 'th').replace(/ð/g, 'd').replace(/æ/g, 'ae')
          .normalize('NFD').replace(/[̀-ͯ]/g, '');
      }

      // ---------- Data derivation ----------

      function isByeMatch(m) {
        return (m.opponent_players || []).length === 0;
      }

      function getAllMatchesSorted(data) {
        const byId = new Map();
        for (const team of Object.values(data.teams || {})) {
          for (const m of team.matches || []) {
            if (isByeMatch(m)) continue;
            if (!byId.has(m.id)) byId.set(m.id, m);
          }
        }
        return Array.from(byId.values()).sort((a, b) => parseTime(a.time) - parseTime(b.time));
      }

      function getMatchesForTeam(data, teamKey) {
        const team = (data.teams || {})[teamKey];
        if (!team || !team.matches) return [];
        return team.matches.filter((m) => !isByeMatch(m)).sort((a, b) => parseTime(a.time) - parseTime(b.time));
      }

      function hasPlayer(m, name) {
        return (m.our_players || []).some((n) => baseName(n) === name)
          || (m.opponent_players || []).some((n) => baseName(n) === name);
      }

      /** Every player that appears in a match, with their club. */
      function buildPlayerIndex(all) {
        const seen = new Map();
        const add = (names, teams) => (names || []).forEach((n, i) => {
          const name = baseName(n);
          const team = (teams && teams[i]) || '';
          const key = name + '|' + team;
          if (name && !seen.has(key)) seen.set(key, { name, team, key: fold(name) });
        });
        all.forEach((m) => { add(m.our_players, m.our_player_teams); add(m.opponent_players, m.opponent_player_teams); });
        return Array.from(seen.values()).sort((a, b) => a.name.localeCompare(b.name, 'is'));
      }

      /** Every tournament day, from all time slots. */
      function buildDays(all) {
        const days = new Map();
        all.forEach((m) => {
          const d = new Date(m.time);
          if (isNaN(d)) return;
          const key = dayKeyOf(d);
          if (!days.has(key)) {
            days.set(key, {
              key,
              short: `${IS_DAYS_SHORT[d.getDay()]} ${d.getDate()}. ${IS_MONTHS_SHORT[d.getMonth()]}`,
              wd: IS_DAYS_SHORT[d.getDay()],
              date: `${d.getDate()}. ${IS_MONTHS_SHORT[d.getMonth()]}`,
              long: `${IS_DAYS[d.getDay()]} ${d.getDate()}. ${IS_MONTHS[d.getMonth()]}`,
            });
          }
        });
        return Array.from(days.values()).sort((a, b) => a.key.localeCompare(b.key));
      }

      /** Group matches by time string, sorted by time. */
      function groupMatchesByTime(matches) {
        const groups = new Map();
        for (const m of matches) {
          const key = m.time || '—';
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(m);
        }
        return Array.from(groups.entries()).sort((a, b) => parseTime(a[0]) - parseTime(b[0]));
      }

      /** What is being viewed: one player, one club, or everything. */
      function viewContext() {
        if (state.selectedPlayer) {
          return { mode: 'player', player: state.selectedPlayer, ctxTeam: state.playerTeam,
            matches: state.all.filter((m) => hasPlayer(m, state.selectedPlayer)) };
        }
        if (state.selectedTeam) {
          return { mode: 'team', team: state.selectedTeam, ctxTeam: state.selectedTeam,
            matches: getMatchesForTeam(state.data, state.selectedTeam) };
        }
        return { mode: 'all', ctxTeam: '', matches: state.all };
      }

      /** Keep the selected day if it has matches; else today, else next day with play, else last day. */
      function ensureDay(matches) {
        const keys = new Set(matches.map((m) => dayKey(m.time)));
        if (state.selectedDay && keys.has(state.selectedDay)) return;
        const today = dayKeyOf(new Date());
        if (keys.has(today)) { state.selectedDay = today; return; }
        const now = Date.now();
        const next = matches.find((m) => parseTime(m.time) >= now);
        if (next) { state.selectedDay = dayKey(next.time); return; }
        if (matches.length) { state.selectedDay = dayKey(matches[matches.length - 1].time); return; }
        if (!state.selectedDay && state.days.length) state.selectedDay = state.days[0].key;
      }

      /** Win/loss record and next unplayed match for one player. */
      function playerStats(name) {
        let w = 0, l = 0, next = 0;
        for (const m of state.all) {
          const onOur = (m.our_players || []).some((n) => baseName(n) === name);
          const onOpp = !onOur && (m.opponent_players || []).some((n) => baseName(n) === name);
          if (!onOur && !onOpp) continue;
          if (m.winner === 'side_a' || m.winner === 'side_b') {
            if ((m.winner === 'side_a') === onOur) w++; else l++;
          } else {
            const t = parseTime(m.time);
            if (t && (!next || t < next)) next = t;
          }
        }
        return { w, l, next };
      }

      // ---------- Match orientation ----------

      /**
       * Decide which side is shown first and flip the scores with it.
       * Club/player view: the selected club's (or player's) side first, W/L from their perspective.
       * "Allir leikir" (or both sides from the selected club): winner first with a W.
       */
      function orient(m, ctx) {
        const our = m.our_players || [];
        const opp = m.opponent_players || [];
        const ourT = m.our_player_teams || [];
        const oppT = m.opponent_player_teams || [];
        const finished = m.winner === 'side_a' || m.winner === 'side_b';

        let focus = null;  // 'our' | 'opp' | null (= winner first)
        if (ctx.mode === 'player') {
          focus = our.some((n) => baseName(n) === ctx.player) ? 'our' : 'opp';
        } else if (ctx.mode === 'team') {
          const o = ourT.includes(ctx.team);
          const p = oppT.includes(ctx.team);
          if (o && !p) focus = 'our';
          else if (p && !o) focus = 'opp';
          else if (!o && !p) focus = 'our';
        }
        const flip = focus ? focus === 'opp' : m.winner === 'side_b';
        const games = (m.result_games || []).filter((g) => Array.isArray(g) && g[0] != null && g[1] != null);
        const first = { names: flip ? opp : our, teams: flip ? oppT : ourT, scores: games.map((g) => (flip ? g[1] : g[0])) };
        const second = { names: flip ? our : opp, teams: flip ? ourT : oppT, scores: games.map((g) => (flip ? g[0] : g[1])) };
        const firstWon = finished && m.winner === (flip ? 'side_b' : 'side_a');
        const badge = !finished ? '—' : (focus ? (firstWon ? 'W' : 'L') : 'W');
        return { first, second, finished, firstWon, badge, walkover: !!m.walkover };
      }

      // ---------- Rendering ----------

      /** Names as tappable links with seed chips, one partner per line; club shown unless it's the club being viewed. */
      function sideHtml(side, ctxTeam) {
        const clubs = [...new Set(side.teams.filter(Boolean))];
        const perName = clubs.length > 1;
        const last = side.names.length - 1;
        return side.names.map((n, i) => {
          const name = baseName(n);
          const seed = seedOf(n);
          const team = side.teams[i] || '';
          let h = `<button type="button" class="player-link" data-player="${escapeHtml(name)}" data-team="${escapeHtml(team)}">${escapeHtml(name)}</button>`;
          if (seed) h += `<span class="seed">${escapeHtml(seed)}</span>`;
          const club = perName ? team : (i === last ? clubs[0] : '');
          if (club && club !== ctxTeam) h += ` <span class="club">${escapeHtml(club)}</span>`;
          return `<span class="block">${h}</span>`;
        }).join('');
      }

      function scoreCells(mine, theirs) {
        return mine.map((s, i) => {
          const won = s > theirs[i];
          return `<span class="w-6 text-right ${won ? 'text-zinc-50 font-semibold' : 'text-mute'}">${escapeHtml(s)}</span>`;
        }).join('');
      }

      function renderMatchRow(m, ctx) {
        const o = orient(m, ctx);
        const badgeClass = o.badge === 'W' ? 'badge-won' : o.badge === 'L' ? 'badge-lost' : 'badge-upcoming';
        const nameClass = (won) => (!o.finished ? 'text-zinc-100' : won ? 'text-zinc-50 font-semibold' : 'text-mute');
        const firstScores = o.walkover
          ? '<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-surface-700 text-zinc-300 whitespace-nowrap">Gefinn leikur</span>'
          : scoreCells(o.first.scores, o.second.scores);
        const secondScores = o.walkover ? '' : scoreCells(o.second.scores, o.first.scores);
        // With draw info: "U13 KK Einliða · Umferð 2" + a "Riðill B2 ›" chip that opens the group drawer
        const did = drawIdOf(m);
        const d = drawsOf()[did];
        const meta = [eventIs(d ? d.event : m.event), roundIs(m.round)].filter(Boolean).join(' · ');
        const chip = d ? `<button type="button" class="group-chip inline-flex items-center gap-0.5 h-[26px] pl-2.5 pr-1.5 rounded-full border border-accent-500/45 bg-accent-500/10 text-amber-300 text-xs font-semibold hover:bg-accent-500/20" data-draw="${escapeHtml(did)}" aria-label="Sjá ${escapeHtml(drawLabel(d))}">${escapeHtml(drawLabel(d))}<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 6l6 6-6 6" /></svg></button>` : '';

        const row = document.createElement('div');
        row.className = 'match-row flex items-start gap-3 px-3 py-2.5 border-b border-surface-700/60 last:border-b-0';
        row.innerHTML = `
          <span class="badge shrink-0 mt-px w-6 h-6 inline-flex items-center justify-center rounded-md text-xs font-semibold ${badgeClass}">${escapeHtml(o.badge)}</span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start gap-3">
              <p class="min-w-0 flex-1 text-[15px] leading-6 break-words ${nameClass(o.firstWon)}">${sideHtml(o.first, ctx.ctxTeam)}</p>
              <span class="scores shrink-0 flex items-center gap-1.5 text-[15px] leading-6 tabular-nums">${firstScores}</span>
            </div>
            <div class="flex items-start gap-3">
              <p class="min-w-0 flex-1 text-[15px] leading-6 break-words ${nameClass(o.finished && !o.firstWon)}">${sideHtml(o.second, ctx.ctxTeam)}</p>
              <span class="scores shrink-0 flex items-center gap-1.5 text-[15px] leading-6 tabular-nums">${secondScores}</span>
            </div>
            <div class="meta text-[13px] text-mute mt-1 flex flex-wrap items-center gap-x-2 gap-y-1"><span class="break-words">${escapeHtml(meta)}</span>${chip}</div>
          </div>`;
        return row;
      }

      function timeSlotId(timeStr) {
        return 'slot-' + btoa(unescape(encodeURIComponent(timeStr))).replace(/[^a-zA-Z0-9]/g, '');
      }

      function renderTimeSlot(timeStr, matches, ctx) {
        const count = matches.length;
        const done = matches.every((m) => m.winner === 'side_a' || m.winner === 'side_b');
        // Colour only slots still to be played; club view colours by how many of the club's matches run at once
        const slotClass = done ? 'time-slot-done' : (ctx.mode === 'team' ? 'time-slot-' + Math.min(count, 6) : 'time-slot-1');
        const countLabel = ctx.mode !== 'all' && count > 1 ? `${count} samtímis` : `${count} leik${count !== 1 ? 'ir' : 'ur'}`;
        const section = document.createElement('section');
        section.id = timeSlotId(timeStr);
        section.className = 'rounded-2xl border overflow-hidden bg-surface-800 ' + slotClass;
        section.innerHTML = `
          <div class="slot-header flex items-center justify-between gap-2 px-3 py-2 border-b border-white/5">
            <span class="text-base font-semibold tabular-nums ${done ? 'text-zinc-300' : 'text-accent-400'}">${escapeHtml(fmtTime(timeStr) || timeStr)}</span>
            <span class="match-count-pill text-xs font-medium px-2 py-0.5 rounded-full bg-surface-700 ${done ? 'text-mute' : 'text-amber-200'}">${countLabel}</span>
          </div>
          <div class="slot-body"></div>`;
        const body = section.querySelector('.slot-body');
        matches.forEach((m) => body.appendChild(renderMatchRow(m, ctx)));
        return section;
      }

      // ---------- Groups (draws) and the group drawer ----------
      // data.draws[id] = { name, event, short, kind: 'group'|'playoff', standings: [...], advances: { pos: { draw, vs, time, round } } }

      const drawsOf = () => (state.data && state.data.draws) || {};
      let nameToDraw = new Map();  // event text on a match → draw id (for entries stored without a draw id)
      const wsNorm = (s) => (s || '').replace(/\s+/g, ' ').trim();
      function drawIdOf(m) {
        return m.draw || nameToDraw.get(wsNorm(m.event)) || '';
      }
      function drawLabel(d) {
        return d.kind === 'group' ? 'Riðill ' + d.short : (d.short || 'Úrslit');
      }
      const isDone = (m) => m.winner === 'side_a' || m.winner === 'side_b';
      const natural = (a, b) => a.localeCompare(b, 'is', { numeric: true });

      /** "10:55" today, otherwise "sun 10:55". */
      function shortWhen(timeStr) {
        const d = new Date(timeStr);
        if (isNaN(d)) return '';
        const hm = fmtTime(timeStr);
        return dayKeyOf(d) === dayKeyOf(new Date()) ? hm : IS_DAYS_SHORT[d.getDay()].toLowerCase() + ' ' + hm;
      }

      function drawMatches(did) {
        return state.all.filter((m) => drawIdOf(m) === did);
      }
      function groupComplete(did) {
        const ms = drawMatches(did);
        return ms.length > 0 && ms.every(isDone);
      }
      const namesOf = (row) => (row.players || []).map(baseName).join(' / ');

      /** A group place: the player's name once the group is finished, otherwise "1. A2". */
      function placeLabel(event, groupShort, pos) {
        const gid = Object.keys(drawsOf()).find((id) => {
          const g = drawsOf()[id];
          return g.kind === 'group' && g.event === event && g.short === groupShort;
        });
        const g = gid && drawsOf()[gid];
        const row = g && groupComplete(gid) && (g.standings || []).find((r) => r.pos === pos);
        return row ? namesOf(row) : `${pos}. ${groupShort}`;
      }
      function vsLabel(vs, event) {
        if (!vs) return '';
        if (vs.group) return placeLabel(event, vs.group, vs.pos);
        if (vs.names && vs.names.length) return vs.names.map(baseName).join(' / ');
        return vs.text && !/^bye$/i.test(vs.text) ? vs.text : '';
      }
      const vsOrOpen = (vs, event) => vsLabel(vs, event) || 'óráðið';

      /** Who goes on: 'all' (everyone plays again), a count, or 0 (no playoff known). */
      function advanceSummary(d) {
        const adv = d.advances || {};
        const n = Object.keys(adv).length;
        const size = (d.standings || []).length;
        if (!n) return { n: 0, all: false, text: '' };
        const all = size > 0 && n >= size;
        return { n, all, text: all ? 'Allir fá aukaleik' : n === 1 ? 'Aðeins efsti kemst áfram' : `Efstu ${n} komast áfram` };
      }

      function isMine(players, teams) {
        if (state.selectedPlayer) return (players || []).some((p) => baseName(p) === state.selectedPlayer);
        return !!state.selectedTeam && (teams || []).includes(state.selectedTeam);
      }

      /** Compact match line for the drawer: time · A v. B · score. */
      function sheetMatchLine(m) {
        const done = isDone(m);
        const a = (m.our_players || []).map(baseName).join(' / ');
        const b = (m.opponent_players || []).map(baseName).join(' / ');
        const aWon = m.winner === 'side_a';
        const games = (m.result_games || []).map((g) => `${g[0]}–${g[1]}`).join(' ');
        const right = m.walkover ? '<span class="text-xs text-mute">Gefinn leikur</span>'
          : done ? `<span class="tabular-nums text-zinc-300">${escapeHtml(games)}</span>`
          : '<span class="text-xs text-mute bg-surface-700 rounded-full px-2 py-0.5">á eftir</span>';
        return `<div class="flex items-center gap-3 min-h-[40px] border-b border-surface-700/60 last:border-b-0 text-sm">
          <span class="w-14 shrink-0 text-mute tabular-nums">${escapeHtml(shortWhen(m.time))}</span>
          <span class="min-w-0 flex-1 truncate"><span class="${done && aWon ? 'font-semibold text-zinc-50' : done ? 'text-mute' : ''}">${escapeHtml(a)}</span> <span class="text-mute">v.</span> <span class="${done && !aWon ? 'font-semibold text-zinc-50' : done ? 'text-mute' : ''}">${escapeHtml(b)}</span></span>
          ${right}</div>`;
      }

      function groupSheetBody(did, d) {
        const rows = d.standings || [];
        const adv = d.advances || {};
        const sum = advanceSummary(d);
        const complete = groupComplete(did);
        let html = '';
        if (!rows.length) {
          html += '<p class="text-sm text-mute py-4">Staðan er ekki komin inn enn.</p>';
        } else {
          html += `<div class="rounded-2xl bg-surface-900 border border-surface-700 overflow-hidden">
            <div class="sheet-grid px-3 py-2 text-[11px] font-semibold uppercase tracking-wide text-mute border-b border-surface-700">
              <span>#</span><span>Leikmaður</span><span class="text-right">Leikir</span><span class="text-right">Lotur</span><span class="text-right">Stig</span></div>`;
          // Before any result the site lists everyone as 1st; ties share a place. Only label clear places.
          const anyPlayed = rows.some((r) => r.played > 0);
          const posCount = rows.reduce((c, r) => c.set(r.pos, (c.get(r.pos) || 0) + 1), new Map());
          rows.forEach((r) => {
            const clear = anyPlayed && posCount.get(r.pos) === 1;
            const a = clear ? adv[r.pos] : null;
            const mine = isMine(r.players, r.teams);
            const clubs = [...new Set((r.teams || []).filter(Boolean))].join(' / ');
            let sub = '';
            if (a) {
              const vs = vsLabel(a.vs, d.event);
              const where = escapeHtml(vs ? 'mætir ' + vs : roundIs(a.round));
              sub = sum.all
                ? `<span class="block text-xs text-amber-300 mt-0.5">→ ${where}</span>`
                : `<span class="flex items-center gap-1.5 mt-1"><span class="text-[10px] font-bold uppercase tracking-wide bg-accent-500 text-surface-900 rounded-full px-2 py-px">Áfram</span><span class="text-xs text-mute truncate">${where}</span></span>`;
            } else if (clear && sum.n && complete) {
              sub = '<span class="block text-xs text-mute mt-0.5">Lokið</span>';
            }
            const names = (r.players || []).map((p) => `<button type="button" class="player-link" data-player="${escapeHtml(baseName(p))}" data-team="${escapeHtml((r.teams || [])[0] || '')}">${escapeHtml(baseName(p))}</button>`).join(' / ');
            html += `<div class="sheet-grid px-3 py-2.5 border-b border-surface-700 last:border-b-0 tabular-nums ${mine ? 'bg-accent-500/10' : ''}">
              <span class="text-[15px] font-bold ${anyPlayed && r.pos === 1 ? 'text-amber-300' : 'text-zinc-300'}">${anyPlayed ? r.pos : '–'}</span>
              <span class="min-w-0"><span class="block text-[15px] ${mine ? 'font-semibold' : ''} truncate">${names} <span class="club">${escapeHtml(clubs)}</span></span>${sub}</span>
              <span class="text-right text-sm font-semibold">${anyPlayed ? `${r.won}–${r.lost}` : '–'}</span>
              <span class="text-right text-sm text-zinc-300">${anyPlayed ? escapeHtml((r.games || '').replace('-', '–')) : '–'}</span>
              <span class="text-right text-[13px] text-mute">${anyPlayed ? escapeHtml((r.points || '').replace('-', '–')) : '–'}</span></div>`;
          });
          html += '</div>';
        }
        // Where the group goes next
        const entries = Object.entries(adv).map(([pos, a]) => ({ pos: +pos, ...a })).sort((x, y) => x.pos - y.pos);
        if (entries.length) {
          const target = drawsOf()[entries[0].draw];
          html += `<div class="rounded-2xl bg-surface-700 px-3.5 py-3">
            <div class="flex items-baseline justify-between gap-2"><h3 class="text-[15px] font-semibold">Næst: ${escapeHtml(target ? drawLabel(target) : 'Úrslit')}</h3>
              <span class="text-xs text-mute">${escapeHtml(roundIs(entries[0].round))}</span></div>
            <p class="text-[13px] text-amber-300 mb-2">${escapeHtml(sum.text)}</p>
            ${entries.map((a) => `<div class="flex items-center gap-3 text-sm min-h-[32px]">
              <span class="w-14 shrink-0 text-mute tabular-nums">${escapeHtml(shortWhen(a.time))}</span>
              <span class="min-w-0 flex-1 truncate">${escapeHtml(placeLabel(d.event, d.short, a.pos))} <span class="text-mute">–</span> ${escapeHtml(vsOrOpen(a.vs, d.event))}</span></div>`).join('')}
          </div>`;
        }
        const ms = drawMatches(did);
        if (ms.length) {
          html += `<div><h3 class="text-xs font-semibold uppercase tracking-wide text-mute mb-1">Leikir í riðlinum</h3>${ms.map(sheetMatchLine).join('')}</div>`;
        }
        return html;
      }

      function playoffSheetBody(pid, p) {
        const ms = drawMatches(pid);
        const seen = new Set(ms.map((m) => [(m.our_players || []).map(baseName).join(' / '), (m.opponent_players || []).map(baseName).join(' / ')].sort().join('|')));
        // Undecided pairings, from the groups that feed this playoff (each pairing is stored by both groups)
        const pending = new Map();
        Object.values(drawsOf()).forEach((g) => {
          Object.entries(g.advances || {}).forEach(([pos, a]) => {
            if (a.draw !== pid) return;
            const pair = [placeLabel(g.event, g.short, +pos), vsOrOpen(a.vs, g.event)];
            const key = [...pair].sort().join('|');
            if (seen.has(key) || pending.has(key + a.time)) return;
            pending.set(key + a.time, { pair, time: a.time, round: a.round });
          });
        });
        let html = '';
        const list = [...pending.values()].sort((x, y) => parseTime(x.time) - parseTime(y.time));
        if (list.length) {
          html += `<div class="rounded-2xl bg-surface-700 px-3.5 py-3"><h3 class="text-[15px] font-semibold mb-1">Óráðnir leikir</h3>
            ${list.map((x) => `<div class="flex items-center gap-3 text-sm min-h-[32px]">
              <span class="w-14 shrink-0 text-mute tabular-nums">${escapeHtml(shortWhen(x.time))}</span>
              <span class="min-w-0 flex-1 truncate">${escapeHtml(x.pair[0])} <span class="text-mute">–</span> ${escapeHtml(x.pair[1])}</span>
              <span class="text-xs text-mute">${escapeHtml(roundIs(x.round))}</span></div>`).join('')}</div>`;
        }
        if (ms.length) html += `<div><h3 class="text-xs font-semibold uppercase tracking-wide text-mute mb-1">Leikir</h3>${ms.map(sheetMatchLine).join('')}</div>`;
        if (!html) html = '<p class="text-sm text-mute py-4">Engir leikir komnir inn enn.</p>';
        return html;
      }

      const $sheet = $('sheet');
      const $sheetPanel = $('sheet-panel');
      const $sheetBody = $('sheet-body');
      const $sheetChips = $('sheet-chips');
      let sheetDraw = '';

      function renderSheet() {
        const draws = drawsOf();
        const d = draws[sheetDraw];
        if (!d) { closeSheet(); return; }
        const ms = drawMatches(sheetDraw);
        const done = ms.filter(isDone).length;
        $('sheet-title').textContent = drawLabel(d);
        $('sheet-sub').textContent = [eventIs(d.event), ms.length ? (done === ms.length ? 'Lokið' : `${done} af ${ms.length} leikjum lokið`) : ''].filter(Boolean).join(' · ');
        const siblings = Object.entries(draws).filter(([, x]) => x.event === d.event)
          .sort(([, a], [, b]) => (a.kind === b.kind ? natural(a.short, b.short) : a.kind === 'group' ? -1 : 1));
        $sheetChips.classList.toggle('hidden', siblings.length < 2);
        $sheetChips.innerHTML = siblings.map(([id, x]) => {
          const active = id === sheetDraw;
          return `<button type="button" class="sheet-chip pill pill-hit shrink-0 h-9 px-4 rounded-full text-sm ${active ? 'bg-accent-500 text-surface-900 font-semibold' : 'bg-surface-700 text-mute hover:text-zinc-100 font-medium'}" data-draw="${escapeHtml(id)}" aria-pressed="${active}">${escapeHtml(x.kind === 'group' ? x.short : (x.short || 'Úrslit'))}</button>`;
        }).join('');
        const scroll = $sheetBody.scrollTop;
        $sheetBody.innerHTML = d.kind === 'group' ? groupSheetBody(sheetDraw, d) : playoffSheetBody(sheetDraw, d);
        $sheetBody.scrollTop = scroll;
        const sel = $sheetChips.querySelector('[aria-pressed="true"]');
        if (sel) $sheetChips.scrollLeft = sel.offsetLeft - ($sheetChips.clientWidth - sel.offsetWidth) / 2;
      }

      function openSheet(did) {
        if (!drawsOf()[did]) return;
        const wasOpen = !$sheet.classList.contains('hidden');
        sheetDraw = did;
        $sheetBody.scrollTop = 0;
        renderSheet();
        if (wasOpen) return;
        $sheet.classList.remove('hidden');
        document.documentElement.classList.add('overflow-hidden');
        requestAnimationFrame(() => requestAnimationFrame(() => $sheet.classList.remove('is-closed')));
        $('sheet-close').focus({ preventScroll: true });
      }

      function closeSheet() {
        if ($sheet.classList.contains('hidden')) return;
        sheetDraw = '';
        $sheet.classList.add('is-closed');
        $sheetPanel.style.transform = '';
        document.documentElement.classList.remove('overflow-hidden');
        setTimeout(() => { if (!sheetDraw) $sheet.classList.add('hidden'); }, 200);
      }

      /** Player view: one card per group the player is in (place, record, what's next). Tap → drawer. */
      function renderGroupCards(ctx) {
        const draws = drawsOf();
        const gids = [...new Set(ctx.matches.map(drawIdOf))].filter((id) => draws[id] && draws[id].kind === 'group');
        if (!gids.length) return null;
        const wrap = document.createElement('div');
        wrap.className = 'group-cards space-y-2 mb-5';
        wrap.innerHTML = gids.map((gid) => {
          const g = draws[gid];
          const rows = g.standings || [];
          const found = rows.find((r) => (r.players || []).some((p) => baseName(p) === ctx.player));
          const row = found && found.played > 0 ? found : null;  // no place shown before the first result
          const a = row && rows.filter((r) => r.pos === row.pos).length === 1 && (g.advances || {})[row.pos];
          const target = a && draws[a.draw];
          const vs = a && vsLabel(a.vs, g.event);
          const next = a ? `Næst: ${target ? drawLabel(target) : 'Úrslit'}${vs ? ' gegn ' + vs : ''} · ${shortWhen(a.time)}` : '';
          return `<button type="button" class="group-card w-full text-left rounded-2xl bg-surface-800 border border-surface-600 hover:bg-surface-700 px-3.5 py-3 flex items-center gap-3.5" data-draw="${escapeHtml(gid)}" aria-label="Opna stöðu í ${escapeHtml(drawLabel(g))}">
            <span class="w-[52px] h-[52px] shrink-0 rounded-xl bg-accent-500/10 text-amber-300 flex flex-col items-center justify-center leading-none">
              <span class="text-[22px] font-bold">${row ? row.pos + '.' : '–'}</span><span class="text-[10px] text-mute mt-1">af ${rows.length || '?'}</span></span>
            <span class="min-w-0 flex-1">
              <span class="block text-[15px] font-semibold truncate">${escapeHtml(drawLabel(g))} <span class="font-normal text-[13px] text-mute">· ${escapeHtml(eventIs(g.event))}</span></span>
              ${row ? `<span class="block text-[13px] text-zinc-300 mt-0.5 tabular-nums">${row.won}–${row.lost} í leikjum · ${escapeHtml((row.games || '').replace('-', '–'))} í lotum</span>` : ''}
              ${next ? `<span class="block text-[13px] text-amber-300 mt-1 truncate">${escapeHtml(next)}</span>` : ''}
            </span>
            <svg class="w-[18px] h-[18px] shrink-0 text-mute" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 6l6 6-6 6" /></svg></button>`;
        }).join('');
        return wrap;
      }

      function bindSheet() {
        $('sheet-close').addEventListener('click', closeSheet);
        $('sheet-backdrop').addEventListener('click', closeSheet);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
        $sheetChips.addEventListener('click', (e) => {
          const c = e.target.closest('.sheet-chip');
          if (c) openSheet(c.dataset.draw);
        });
        $sheetBody.addEventListener('click', (e) => {
          const link = e.target.closest('.player-link');
          if (!link) return;
          closeSheet();
          selectPlayer(link.dataset.player, link.dataset.team);
        });
        // Swipe the top of the drawer down to close it
        const grab = $('sheet-grab');
        let startY = null, dy = 0;
        grab.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; dy = 0; $sheetPanel.style.transition = 'none'; }, { passive: true });
        grab.addEventListener('touchmove', (e) => {
          if (startY == null) return;
          dy = Math.max(0, e.touches[0].clientY - startY);
          $sheetPanel.style.transform = `translateY(${dy}px)`;
        }, { passive: true });
        grab.addEventListener('touchend', () => {
          $sheetPanel.style.transition = '';
          if (dy > 80) closeSheet(); else $sheetPanel.style.transform = '';
          startY = null;
        });
      }

      /** Club view: bars for every slot of the selected day; bar height = club matches in that slot. */
      function renderTimeline(clubGroups, daySlots, team) {
        const counts = new Map(clubGroups.map(([t, ms]) => [t, ms.length]));
        const max = Math.max(1, ...counts.values());
        const mine = daySlots.filter((t) => counts.has(t));
        const box = document.createElement('div');
        box.className = 'rounded-2xl border border-surface-700 bg-surface-800 px-3 py-2.5';
        const range = mine.length ? fmtTime(mine[0]) + (mine.length > 1 ? ' – ' + fmtTime(mine[mine.length - 1]) : '') : '';
        box.innerHTML = `<p class="flex justify-between gap-2 text-xs mb-2"><span class="font-semibold text-accent-400">Dagskrá ${escapeHtml(team)}</span><span class="text-mute tabular-nums">${escapeHtml(range)}</span></p>`;
        const row = document.createElement('div');
        row.className = 'flex items-end gap-1 h-12';
        daySlots.forEach((t) => {
          const n = counts.get(t) || 0;
          const label = `${fmtTime(t)} – ${n ? n + ' leik' + (n !== 1 ? 'ir' : 'ur') : 'engir leikir'}`;
          const bar = document.createElement('button');
          bar.type = 'button';
          bar.title = label;
          bar.setAttribute('aria-label', label);
          bar.style.height = (n ? Math.max(18, (n / max) * 100) : 6) + '%';
          bar.className = 'flex-1 min-w-0 rounded-t transition-opacity focus:outline-none '
            + (n ? 'timeline-bar-' + Math.min(n, 6) + ' hover:opacity-75 cursor-pointer' : 'bg-surface-700 cursor-default');
          if (n) bar.addEventListener('click', () => scrollToSlot(t));
          row.appendChild(bar);
        });
        box.appendChild(row);
        return box;
      }

      function navOffset() {
        return ($nav ? $nav.offsetHeight : 0) + 8;
      }

      /** Document Y that puts a slot just under the sticky header (minus an optional peek above it). */
      function slotScrollY(timeStr, peek = 0) {
        const target = document.getElementById(timeSlotId(timeStr));
        if (!target) return null;
        return Math.max(0, Math.round(target.getBoundingClientRect().top + window.scrollY - navOffset() - peek));
      }

      /** Timeline bar tap: smooth scroll, slot right under the header. */
      function scrollToSlot(timeStr) {
        const y = slotScrollY(timeStr);
        if (y != null) window.scrollTo({ top: y, behavior: 'smooth' });
      }

      const NOW_PEEK = 64;               // leave the last row of the previous slot visible
      const STUCK_MATCH_MS = 90 * 60000; // unfinished matches older than this are treated as stale (result never entered)

      /**
       * "Now" on today's tab = the first slot that still has an unfinished match (what's on court or up next),
       * not the first slot by scheduled clock time: tournaments run late.
       */
      function findNowSlot(dayGroups) {
        if (state.selectedDay !== dayKeyOf(new Date())) return null;
        const cutoff = Date.now() - STUCK_MATCH_MS;
        const isDone = (m) => m.winner === 'side_a' || m.winner === 'side_b';
        const slot = dayGroups.find(([t, ms]) => parseTime(t) >= cutoff && ms.some((m) => !isDone(m)));
        return slot ? slot[0] : null;
      }

      /** Wait for web fonts + Tailwind CDN styling so box heights are final before measuring. */
      async function afterLayout() {
        try { await document.fonts.ready; } catch (e) { /* ignore */ }
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      }

      let scrollSeq = 0;
      /**
       * Jump to "now" on today's tab; otherwise make sure the list top is in view.
       * instant: first load (jump, then re-check once in case layout still shifted). Otherwise smooth (taps).
       */
      async function scrollToNow(dayGroups, { instant = false } = {}) {
        const seq = ++scrollSeq;
        await afterLayout();
        if (seq !== scrollSeq) return;  // a newer render took over
        const slot = findNowSlot(dayGroups);
        const behavior = instant ? 'instant' : 'smooth';
        if (!slot) {
          const listTop = Math.max(0, document.querySelector('main').getBoundingClientRect().top + window.scrollY - $nav.offsetHeight);
          if (window.scrollY > listTop) window.scrollTo({ top: listTop, behavior });
          return;
        }
        const y = slotScrollY(slot, NOW_PEEK);
        if (y == null) return;
        window.scrollTo({ top: y, behavior });
        if (!instant) return;
        // Late layout shift (fonts/styles finishing): correct once, unless the user has already scrolled
        const landed = window.scrollY;
        setTimeout(() => {
          if (seq !== scrollSeq || Math.abs(window.scrollY - landed) > 2) return;
          const y2 = slotScrollY(slot, NOW_PEEK);
          if (y2 != null && Math.abs(y2 - window.scrollY) > 4) window.scrollTo({ top: y2, behavior: 'instant' });
        }, 300);
      }

      function renderPills(teams) {
        filterWrap.querySelectorAll('.filter-pill').forEach((el, i) => { if (i > 0) el.remove(); });
        teams.forEach((teamKey) => {
          const clone = pillTemplate.content.cloneNode(true);
          const btn = clone.querySelector('button');
          btn.textContent = teamKey;
          btn.dataset.team = teamKey;
          filterWrap.appendChild(clone);
        });
        filterWrap.querySelectorAll('.filter-pill').forEach((b) => {
          const active = !state.selectedPlayer && b.dataset.team === state.selectedTeam;
          b.classList.toggle('bg-accent-500', active);
          b.classList.toggle('text-surface-900', active);
          b.classList.toggle('bg-surface-700', !active);
          b.classList.toggle('text-mute', !active);
          b.setAttribute('aria-pressed', String(active));
        });
      }

      /**
       * Day tabs in the header: weekday (or amber "Í dag") over the date. Days with no matches for the
       * current filter are disabled. More days than fit scroll sideways, keeping the selected one in view.
       */
      function renderDayTabs(matches) {
        const today = dayKeyOf(new Date());
        const counts = new Map();
        matches.forEach((m) => { const k = dayKey(m.time); counts.set(k, (counts.get(k) || 0) + 1); });
        $dayTabs.innerHTML = state.days.map((d) => {
          const active = d.key === state.selectedDay;
          const isToday = d.key === today;
          const n = counts.get(d.key) || 0;
          const label = `${d.long}${isToday ? ' (í dag)' : ''}: ${n} leik${n !== 1 ? 'ir' : 'ur'}`;
          return `<button type="button" data-day="${d.key}" aria-pressed="${active}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"${n ? '' : ' disabled'}
            class="day-tab flex-1 min-w-[4rem] h-[38px] rounded-[11px] flex flex-col items-center justify-center gap-1 leading-none ${active ? 'bg-surface-600 shadow shadow-black/50' : 'hover:bg-surface-700'} ${n ? '' : 'opacity-40'}">
            <span class="text-[10px] font-bold uppercase tracking-wider ${isToday ? 'text-accent-500' : 'text-mute'}">${isToday ? 'Í dag' : escapeHtml(d.wd)}</span>
            <span class="text-sm whitespace-nowrap ${active ? 'font-semibold text-zinc-50' : 'font-medium text-zinc-300'}">${escapeHtml(d.date)}</span></button>`;
        }).join('');
        $dayTabs.classList.remove('invisible');
        const sel = $dayTabs.querySelector('[aria-pressed="true"]');
        if (sel && $dayTabs.scrollWidth > $dayTabs.clientWidth) {
          $dayTabs.scrollLeft = sel.offsetLeft - ($dayTabs.clientWidth - sel.offsetWidth) / 2;
        }
      }

      function renderPrintHeader(ctx) {
        // Print is a laptop thing: never shown on phones (<640px), and only for a club or player
        $btnPrint.classList.toggle('sm:inline-flex', ctx.mode !== 'all');
        if (ctx.mode === 'all') return;
        const tournName = state.currentTournament ? state.currentTournament.name : '';
        const who = ctx.mode === 'player' ? ctx.player + (ctx.ctxTeam ? ' (' + ctx.ctxTeam + ')' : '') : ctx.team;
        $printHeader.innerHTML = `<h2>${escapeHtml(tournName)} — ${escapeHtml(who)}</h2><p>${escapeHtml(formatLastUpdated(state.data.last_updated))}</p>`;
      }

      /** Render list for the current filter. All days are rendered; only the selected day is visible (print shows all). */
      function renderList(ctx) {
        $list.innerHTML = '';
        const byDay = new Map();
        ctx.matches.forEach((m) => {
          const k = dayKey(m.time);
          if (!byDay.has(k)) byDay.set(k, []);
          byDay.get(k).push(m);
        });
        let dayGroups = [];
        state.days.forEach((day) => {
          const dm = byDay.get(day.key);
          if (!dm || !dm.length) return;
          const groups = groupMatchesByTime(dm);
          if (day.key === state.selectedDay) dayGroups = groups;
          const wrap = document.createElement('div');
          const allDays = ctx.mode === 'player';  // a player's few matches: show every day with a heading
          wrap.className = 'day-group space-y-3' + (allDays ? ' mb-6' : (day.key === state.selectedDay ? '' : ' hidden'));
          wrap.dataset.day = day.key;
          wrap.innerHTML = `<h2 class="day-heading ${allDays ? 'text-sm font-semibold text-zinc-300 pt-1' : 'hidden'}">${escapeHtml(day.long)}</h2>`;
          groups.forEach(([t, ms]) => wrap.appendChild(renderTimeSlot(t, ms, ctx)));
          $list.appendChild(wrap);
        });
        if (ctx.mode === 'player') {
          const cards = renderGroupCards(ctx);
          if (cards) $list.prepend(cards);
        }
        // Matches with an unparseable time (shouldn't happen) go last, always visible
        const odd = byDay.get('');
        if (odd && odd.length) {
          const wrap = document.createElement('div');
          wrap.className = 'day-group space-y-3 mt-3';
          groupMatchesByTime(odd).forEach(([t, ms]) => wrap.appendChild(renderTimeSlot(t, ms, ctx)));
          $list.appendChild(wrap);
        }

        if (ctx.mode === 'team' && dayGroups.length) {
          const daySlots = [...new Set(state.all.filter((m) => dayKey(m.time) === state.selectedDay).map((m) => m.time))]
            .sort((a, b) => parseTime(a) - parseTime(b));
          $timelineWrap.innerHTML = '';
          $timelineWrap.appendChild(renderTimeline(dayGroups, daySlots, ctx.team));
          $timelineWrap.classList.remove('hidden');
        } else {
          $timelineWrap.classList.add('hidden');
          $timelineWrap.innerHTML = '';
        }

        if (!ctx.matches.length) showEmpty('Engir leikir', ctx.mode === 'player' ? 'Engir leikir fundust fyrir þennan leikmann.' : 'Veldu annað lið.');
        else if (ctx.mode !== 'player' && !dayGroups.length && !(odd && odd.length)) showEmpty('Engir leikir þennan dag', 'Veldu annan dag.');
        else showList();
        return dayGroups;
      }

      /**
       * Full render from state. scroll: 'now' (jump to the slot being played on today's tab), 'top', or null (keep position).
       * instant: jump without animation (first load / refresh button); taps use smooth scrolling.
       */
      function render({ scroll = null, instant = false } = {}) {
        const data = state.data;
        if (state.currentTournament) setTournamentTitle(state.currentTournament.name);
        $lastUpdated.textContent = formatAge(data.last_updated);
        const refreshLabel = formatLastUpdated(data.last_updated) + '. Sækja nýjustu gögn';
        $btnRefresh.title = refreshLabel;
        $btnRefresh.setAttribute('aria-label', refreshLabel);

        const teams = Object.keys(data.teams || {}).sort((a, b) => {
          if (a === 'UMFA') return -1;
          if (b === 'UMFA') return 1;
          return a.localeCompare(b, 'is');
        });
        if (state.selectedTeam && !teams.includes(state.selectedTeam)) state.selectedTeam = '';
        if (state.selectedPlayer && !state.players.some((p) => p.name === state.selectedPlayer)) {
          state.selectedPlayer = '';
          $search.value = '';
        }
        if (state.selectedPlayer && !state.playerTeam) {
          const p = state.players.find((x) => x.name === state.selectedPlayer);
          state.playerTeam = p ? p.team : '';
        }
        syncSearchUi();

        renderPills(teams);
        const ctx = viewContext();
        renderPrintHeader(ctx);
        ensureDay(ctx.matches);
        renderDayTabs(ctx.matches);
        const dayGroups = renderList(ctx);
        if (sheetDraw) renderSheet();  // keep an open drawer current on refresh

        if (scroll === 'now') scrollToNow(dayGroups, { instant });
        else if (scroll === 'top') { scrollSeq++; window.scrollTo({ top: 0, behavior: 'smooth' }); }
        else scrollSeq++;  // cancel any pending "now" jump (e.g. silent refresh keeps the user's position)
      }

      function setHash() {
        const h = state.selectedPlayer ? 'p:' + state.selectedPlayer : state.selectedTeam;
        history.replaceState(null, '', h ? '#' + encodeURIComponent(h) : location.pathname + location.search);
      }

      // ---------- Search ----------

      function closeSuggest() {
        $suggest.classList.add('hidden');
        $suggest.innerHTML = '';
        $search.setAttribute('aria-expanded', 'false');
      }

      function suggestItem(p, showClub) {
        const s = playerStats(p.name);
        let next = '';
        if (s.next) {
          const d = new Date(s.next);
          const sameDay = dayKeyOf(d) === dayKeyOf(new Date());
          next = 'næst ' + (sameDay ? '' : IS_DAYS_SHORT[d.getDay()].toLowerCase() + ' ') + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
        }
        const record = s.w + s.l ? `${s.w}–${s.l}` : '';
        return `<button type="button" role="option" class="suggest-item w-full min-h-[44px] px-3 py-2 rounded-xl flex items-center justify-between gap-3 text-left hover:bg-surface-700 focus:bg-surface-700 focus:outline-none transition-colors"
            data-player="${escapeHtml(p.name)}" data-team="${escapeHtml(p.team)}">
          <span class="min-w-0"><span class="text-[15px] text-zinc-100">${escapeHtml(p.name)}</span>${showClub ? ` <span class="club">${escapeHtml(p.team)}</span>` : ''}</span>
          <span class="shrink-0 flex items-center gap-2 text-xs tabular-nums">
            ${record ? `<span class="text-zinc-300" title="Sigrar–töp">${record}</span>` : ''}
            ${next ? `<span class="text-amber-200">${escapeHtml(next)}</span>` : ''}
          </span></button>`;
      }

      /** Typing: matching players. Empty box with a club selected: that club's players (record + next match). */
      function updateSuggest() {
        if (!state.data) return;
        const q = fold($search.value.trim());
        let items, heading = '';
        if (!q) {
          if (!state.selectedTeam || state.selectedPlayer) { closeSuggest(); return; }
          items = state.players.filter((p) => p.team === state.selectedTeam);
          heading = 'Leikmenn ' + state.selectedTeam;
        } else {
          items = state.players.filter((p) => p.key.includes(q))
            .sort((a, b) => (b.key.split(' ').some((w) => w.startsWith(q)) ? 1 : 0) - (a.key.split(' ').some((w) => w.startsWith(q)) ? 1 : 0))
            .slice(0, 8);
        }
        $suggest.innerHTML = (heading ? `<p class="px-3 pt-2 pb-1 text-xs font-semibold text-accent-400">${escapeHtml(heading)}</p>` : '')
          + (items.length ? items.map((p) => suggestItem(p, !heading)).join('') : '<p class="px-3 py-3 text-sm text-mute">Enginn leikmaður fannst</p>');
        $suggest.classList.remove('hidden');
        $search.setAttribute('aria-expanded', 'true');
      }

      function selectPlayer(name, team) {
        state.selectedPlayer = name;
        state.playerTeam = team || ((state.players.find((p) => p.name === name) || {}).team || '');
        $search.value = name;
        closeSuggest();
        $search.blur();
        setHash();
        render({ scroll: 'top' });
      }

      function clearPlayer() {
        state.selectedPlayer = '';
        state.playerTeam = '';
        $search.value = '';
        setHash();
      }

      /** Expand the search field in place of the title (title row stays one line high). */
      function openSearch({ focus = true } = {}) {
        $titleBlock.classList.add('hidden');
        $btnSearch.classList.add('hidden');
        $searchWrap.classList.remove('hidden');
        if (focus) $search.focus();
      }

      /** Collapse back to the title; clears a selected player and returns to the normal view. */
      function closeSearch() {
        const had = !!state.selectedPlayer;
        clearPlayer();
        closeSuggest();
        $searchWrap.classList.add('hidden');
        $titleBlock.classList.remove('hidden');
        $btnSearch.classList.remove('hidden');
        $search.blur();
        if (had && state.data) render({ scroll: 'now' });
      }

      /** Player view gets an amber outline so it's clear the list is filtered to one person. */
      function syncSearchUi() {
        if (state.selectedPlayer) {
          openSearch({ focus: false });
          if (document.activeElement !== $search) $search.value = state.selectedPlayer;
        }
        $search.classList.toggle('border-accent-500/70', !!state.selectedPlayer);
        $search.classList.toggle('border-surface-700', !state.selectedPlayer);
      }

      function bindSearch() {
        $btnSearch.addEventListener('click', () => openSearch());
        $search.addEventListener('focus', updateSuggest);
        $search.addEventListener('input', () => {
          if (!$search.value && state.selectedPlayer) { clearPlayer(); render({ scroll: null }); }
          updateSuggest();
        });
        $search.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (state.selectedPlayer) { closeSuggest(); $search.blur(); } else closeSearch();
          }
          if (e.key === 'Enter') {
            const first = $suggest.querySelector('.suggest-item');
            if (first) selectPlayer(first.dataset.player, first.dataset.team);
          }
        });
        // ✕ always clears the player and closes the search
        $searchClear.addEventListener('click', closeSearch);
        // Keep focus in the input while tapping a suggestion (otherwise blur could collapse the field first)
        $suggest.addEventListener('mousedown', (e) => e.preventDefault());
        $suggest.addEventListener('click', (e) => {
          const item = e.target.closest('.suggest-item');
          if (item) selectPlayer(item.dataset.player, item.dataset.team);
        });
        // Tapping elsewhere with nothing typed and no player selected collapses the field
        document.addEventListener('click', (e) => {
          if ($searchWrap.contains(e.target) || $suggest.contains(e.target) || $btnSearch.contains(e.target)) return;
          closeSuggest();
          if (!state.selectedPlayer && !$search.value.trim() && !$searchWrap.classList.contains('hidden')) closeSearch();
        });
      }

      // ---------- Events ----------

      function bindFilters() {
        filterWrap.addEventListener('click', (e) => {
          const btn = e.target.closest('.filter-pill');
          if (!btn || !state.data) return;
          state.selectedTeam = btn.dataset.team || '';
          clearPlayer();
          closeSuggest();
          render({ scroll: 'now' });
        });
        $dayTabs.addEventListener('click', (e) => {
          const btn = e.target.closest('.day-tab');
          if (!btn || btn.disabled || !state.data) return;
          state.selectedDay = btn.dataset.day;
          render({ scroll: 'now' });
        });
        $list.addEventListener('click', (e) => {
          const g = e.target.closest('.group-chip, .group-card');
          if (g) { openSheet(g.dataset.draw); return; }
          const link = e.target.closest('.player-link');
          if (link) selectPlayer(link.dataset.player, link.dataset.team);
        });
      }

      async function loadTournamentData(tournamentId, { silent = false } = {}) {
        const scrollY = window.scrollY;
        if (!silent) showLoading();
        try {
          const r = await fetch(`${dataBaseUrl}/${tournamentId}_v2.json`);
          if (!r.ok) throw new Error(r.statusText || 'Tókst ekki að sækja gögn');
          const data = await r.json();
          state.data = data;
          state.all = getAllMatchesSorted(data);
          state.players = buildPlayerIndex(state.all);
          state.days = buildDays(state.all);
          nameToDraw = new Map(Object.entries(data.draws || {}).map(([id, d]) => [wsNorm(d.name), id]));
          render(silent ? { scroll: null } : { scroll: 'now', instant: true });
          if (silent) window.scrollTo({ top: scrollY, behavior: 'instant' });
        } catch (err) {
          if (!silent) {
            const isFetchError = (err.message || '').toLowerCase().includes('fetch');
            showError(err.message || 'Netvilla.', location.protocol === 'file:' || isFetchError);
          }
        }
      }

      async function load() {
        showLoading();
        try {
          const tr = await fetch(tournamentsUrl);
          if (!tr.ok) throw new Error('Tókst ekki að sækja mótalista');
          const tournaments = await tr.json();
          state.tournaments = Array.isArray(tournaments) ? tournaments : [];
          const defaultT = pickDefaultTournament(state.tournaments);
          if (!defaultT) {
            showError('Ekkert mót er skráð.');
            return;
          }
          state.currentTournament = defaultT;
          setTournamentTitle(defaultT.name);
          await loadTournamentData(defaultT.id);
        } catch (err) {
          const isFetchError = (err.message || '').toLowerCase().includes('fetch');
          showError(err.message || 'Netvilla.', location.protocol === 'file:' || isFetchError);
        }
      }

      $btnRefresh.addEventListener('click', () => {
        if (state.currentTournament) loadTournamentData(state.currentTournament.id);
        else load();
      });
      $btnPrint.addEventListener('click', () => window.print());
      $('retry-btn').addEventListener('click', () => load());
      bindFilters();
      bindSearch();
      bindSheet();
      load();

      // Auto-refresh every 30 seconds, silently (no loading flash, keeps scroll, filters and day)
      setInterval(() => {
        if (state.currentTournament && document.visibilityState === 'visible') {
          loadTournamentData(state.currentTournament.id, { silent: true });
        }
      }, 30000);
    })();
  </script>
</body>
</html>
