# Scrapes tournament data every 5 min (peak 08–22 UTC) or hourly (off-peak).
name: Scrape tournament data

on:
  schedule:
    # Every 5 minutes during peak hours (08:00–21:55 UTC)
    - cron: '*/5 8-21 * * *'
    # Top of every hour outside peak (00:00–07:00 and 22:00–23:00 UTC)
    - cron: '0 0-7,22-23 * * *'
  workflow_dispatch:  # Allow "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # so we can push the updated data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper_v2.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update tournament data [scrape]" && git pull --rebase && git push)
