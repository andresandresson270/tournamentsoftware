# Run the scraper every 30 minutes and commit updated data.json so the site stays fresh.
name: Scrape tournament data

on:
  schedule:
    # Every 10 minutes during peak hours (08:00–17:50 UTC)
    - cron: '*/10 8-17 * * *'
    # Top of every hour outside peak (00:00–07:00 and 18:00–23:00 UTC)
    - cron: '0 0-7,18-23 * * *'
  workflow_dispatch:  # Allow "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # so we can push the updated data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: update tournament data [scrape]" && git pull --rebase && git push)
